<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Павловський В.А. - ІП-44 - ЛР5 - Варіант 1</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <h2>Form</h2>
    <div class="task-1-container">
        <form id="data-form">
            <div class="form-group">
                <label for="pib">ПІБ (ТТТТТТ Т.Т.):</label>
                <input type="text" id="pib" placeholder="Власюк В.А." value="Власюк В.А.">
            </div>

            <div class="form-group">
                <label for="variant">Варіант (ЧЧ):</label>
                <input type="text" id="variant" placeholder="01" value="01">
            </div>

            <div class="form-group">
                <label for="group">Група (ТТ-ЧЧ):</label>
                <input type="text" id="group" placeholder="ІП-44" value="ІП-44">
            </div>

            <div class="form-group">
                <label for="phone">Телефон ((ЧЧЧ)-ЧЧЧ-ЧЧ-ЧЧ):</label>
                <input type="text" id="phone" placeholder="(099)-123-45-67" value="(099)-123-45-67">
            </div>

            <div class="form-group">
                <label for="idcard">ID-card (ТТ №ЧЧЧЧЧЧ):</label>
                <input type="text" id="idcard" placeholder="АВ №123456" value="АВ №123456">
            </div>

            <button type="submit">Підтвердити</button>
        </form>

        <div id="output-container" class="hidden">
            <h3>Введені дані</h3>
            <ul id="output-list"></ul>
        </div>
    </div>

    <hr>

    <h2>Interactive Table</h2>
    <p>Наведіть, клікніть або зробіть подвійний клік на клітинку 1 (мій варіант).</p>

    <div class="color-picker-container">
        <label for="color-picker">Оберіть колір для кліку/подвійного кліку:</label>
        <input type="color" id="color-picker" value="#ff0000">
    </div>

    <table id="interactive-table">
        <!-- Таблиця буде згенерована через JS -->
    </table>

</body>

</html>
